  <g fill="#e2b33c">
    <rect x="19" y="23" width="18" height="8.6" rx="1.2"/>
    <rect x="40" y="23" width="17" height="8.6" rx="1.2"/>
    <rect x="19" y="35.7" width="8.5" height="8.6" rx="1.2"/>
    <rect x="30.5" y="35.7" width="26.5" height="8.6" rx="1.2"/>
    <rect x="19" y="48.4" width="25.5" height="8.6" rx="1.2"/>
    <rect x="47.5" y="48.4" width="9.5" height="8.6" rx="1.2"/>
  </g>
  <!-- Wordmark -->
  <text x="84" y="44" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="31" font-weight="700" fill="#0b0b0c" letter-spacing="-1.4">Cook</text>
  <text x="85.5" y="61" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" letter-spacing="3" fill="#55575c">FLOORING &amp; TILE</text>
